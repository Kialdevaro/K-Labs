<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Labs Retro Engine - Kialdevaro Group</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: #030712; 
      color: #f8fafc; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      overflow-x: hidden; 
    }
    .container { 
      max-width: 800px; 
      margin: 0 auto; 
      padding: 10px; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
    }
    .header-panel { 
      background: rgba(15, 23, 42, 0.8); 
      border: 1px solid rgba(0, 255, 204, 0.2); 
      border-radius: 12px; 
      padding: 12px; 
      backdrop-filter: blur(10px); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .brand-title { 
      font-size: 14px; 
      font-weight: bold; 
      color: #00ffcc; 
      letter-spacing: 1px; 
    }
    .control-panel { 
      background: rgba(15, 23, 42, 0.9); 
      border: 1px solid rgba(0, 255, 204, 0.2); 
      border-radius: 12px; 
      padding: 12px; 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
    }
    .file-group { 
      display: flex; 
      gap: 10px; 
      align-items: center; 
      justify-content: space-between; 
      font-size: 12px; 
      color: #94a3b8; 
    }
    .file-group input[type="file"] { 
      font-size: 11px; 
      color: #00ffcc; 
    }
    .btn-run { 
      background: linear-gradient(135deg, #00ffcc, #0088ff); 
      color: #030712; 
      border: none; 
      font-weight: bold; 
      padding: 10px 16px; 
      border-radius: 8px; 
      cursor: pointer; 
      text-align: center; 
      font-size: 13px; 
      transition: 0.2s; 
    }
    .btn-run:hover { 
      opacity: 0.9; 
      transform: scale(1.01); 
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-panel">
      <div class="brand-title">K-LABS RETRO ENGINE</div>
      <div style="font-size: 11px; color: #94a3b8;">© 2026 Kialdevaro Group</div>
    </div>
    
    <div class="control-panel">
      <div class="file-group">
        <span>1. FILE BIOS PS1 (.bin):</span>
        <input type="file" id="biosFile">
      </div>
      <div class="file-group">
        <span>2. FILE GAME ROM (.bin/.iso):</span>
        <input type="file" id="romFile">
      </div>
      <button class="btn-run" onclick="bootMasterEngine()">▶ JALANKAN GAME (1-KLIK)</button>
    </div>
        <!-- Wadah Kanvas Grafis Utama (ID 'game' wajib ada untuk core.js) -->
    <div id="game" style="width: 100%; aspect-ratio: 4/3; background: #030712; border-radius: 12px; border: 1px solid rgba(0,255,204,0.3); overflow: hidden; display: flex; align-items: center; justify-content: center;">
    </div>

    <!-- Panel Tombol Bahu & Menu Stik Virtual -->
    <div style="background: rgba(15, 23, 42, 0.8); border-radius: 12px; padding: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(0,255,204,0.1);">
      <div style="display: flex; gap: 5px;">
        <button onmousedown="KLabsPressButton('L1', true)" onmouseup="KLabsPressButton('L1', false)" ontouchstart="KLabsPressButton('L1', true)" ontouchend="KLabsPressButton('L1', false)" style="padding: 6px 12px; background: #1e293b; color: #00ffcc; border: 1px solid #00ffcc44; border-radius: 6px; font-size: 11px;">L1</button>
        <button onmousedown="KLabsPressButton('L2', true)" onmouseup="KLabsPressButton('L2', false)" ontouchstart="KLabsPressButton('L2', true)" ontouchend="KLabsPressButton('L2', false)" style="padding: 6px 12px; background: #1e293b; color: #00ffcc; border: 1px solid #00ffcc44; border-radius: 6px; font-size: 11px;">L2</button>
      </div>
      <div style="display: flex; gap: 8px;">
        <button onmousedown="KLabsPressButton('SELECT', true)" onmouseup="KLabsPressButton('SELECT', false)" ontouchstart="KLabsPressButton('SELECT', true)" ontouchend="KLabsPressButton('SELECT', false)" style="padding: 4px 10px; background: #1e293b; color: #94a3b8; border: 1px solid #ffffff22; border-radius: 4px; font-size: 10px;">SELECT</button>
        <button onmousedown="KLabsPressButton('START', true)" onmouseup="KLabsPressButton('START', false)" ontouchstart="KLabsPressButton('START', true)" ontouchend="KLabsPressButton('START', false)" style="padding: 4px 10px; background: #1e293b; color: #94a3b8; border: 1px solid #ffffff22; border-radius: 4px; font-size: 10px;">START</button>
      </div>
      <div style="display: flex; gap: 5px;">
        <button onmousedown="KLabsPressButton('R1', true)" onmouseup="KLabsPressButton('R1', false)" ontouchstart="KLabsPressButton('R1', true)" ontouchend="KLabsPressButton('R1', false)" style="padding: 6px 12px; background: #1e293b; color: #00ffcc; border: 1px solid #00ffcc44; border-radius: 6px; font-size: 11px;">R1</button>
        <button onmousedown="KLabsPressButton('R2', true)" onmouseup="KLabsPressButton('R2', false)" ontouchstart="KLabsPressButton('R2', true)" ontouchend="KLabsPressButton('R2', false)" style="padding: 6px 12px; background: #1e293b; color: #00ffcc; border: 1px solid #00ffcc44; border-radius: 6px; font-size: 11px;">R2</button>
      </div>
    </div>
        <!-- D-Pad & Action Buttons Bawah -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 5px 10px;">
      <div style="width: 85px; height: 85px; background: rgba(255,255,255,0.03); border-radius: 50%; border: 1px solid #00ffcc33; display: flex; align-items: center; justify-content: center; position: relative;">
        <div style="position: absolute; top: 2px; cursor: pointer; color: #00ffcc; font-size: 12px;" onmousedown="KLabsPressButton('UP', true)" onmouseup="KLabsPressButton('UP', false)">▲</div>
        <div style="position: absolute; bottom: 2px; cursor: pointer; color: #00ffcc; font-size: 12px;" onmousedown="KLabsPressButton('DOWN', true)" onmouseup="KLabsPressButton('DOWN', false)">▼</div>
        <div style="position: absolute; left: 4px; cursor: pointer; color: #00ffcc; font-size: 12px;" onmousedown="KLabsPressButton('LEFT', true)" onmouseup="KLabsPressButton('LEFT', false)">◀</div>
        <div style="position: absolute; right: 4px; cursor: pointer; color: #00ffcc; font-size: 12px;" onmousedown="KLabsPressButton('RIGHT', true)" onmouseup="KLabsPressButton('RIGHT', false)">▶</div>
      </div>
      
      <div style="display: grid; grid-template-columns: repeat(2, 35px); gap: 6px;">
        <button onmousedown="KLabsPressButton('SQUARE', true)" onmouseup="KLabsPressButton('SQUARE', false)" style="height: 35px; background: #1e293b; color: #00ffcc; border: 1px solid #00ffcc44; border-radius: 50%; font-size: 12px;">□</button>
        <button onmousedown="KLabsPressButton('TRIANGLE', true)" onmouseup="KLabsPressButton('TRIANGLE', false)" style="height: 35px; background: #1e293b; color: #00ffcc; border: 1px solid #00ffcc44; border-radius: 50%; font-size: 12px;">△</button>
        <button onmousedown="KLabsPressButton('CROSS', true)" onmouseup="KLabsPressButton('CROSS', false)" style="height: 35px; background: #1e293b; color: #00ffcc; border: 1px solid #00ffcc44; border-radius: 50%; font-size: 12px;">✕</button>
        <button onmousedown="KLabsPressButton('CIRCLE', true)" onmouseup="KLabsPressButton('CIRCLE', false)" style="height: 35px; background: #1e293b; color: #00ffcc; border: 1px solid #00ffcc44; border-radius: 50%; font-size: 12px;">◯</button>
      </div>
    </div>
  </div>

  <!-- Skrip Penggerak Mesin K-Labs -->
   <script>
    async function bootMasterEngine() {
      try {
        const biosInput = document.getElementById('biosFile');
        const romInput = document.getElementById('romFile');

        if (!biosInput.files[0]) {
          alert("Harap pilih file BIOS PS1 (.bin) terlebih dahulu!");
          return;
        }
        if (!romInput.files[0]) {
          alert("Harap pilih file Game ROM (.bin/.iso) terlebih dahulu!");
          return;
        }

        if (!window.KLabsEngine || !window.KLabsEngine.loader) {
          alert("Galat: Core Engine (core.js) belum terhubung atau dimuat dengan benar!");
          return;
        }

        console.log("[K-Labs Studio] Memproses file biner ke memori inti mandiri...");
        
        // Memuat file BIOS dan ROM ke memori
        await window.KLabsEngine.loader.loadBIOS(biosInput.files[0]);
        await window.KLabsEngine.loader.loadROM(romInput.files[0]);

        // Mengaktifkan status CPU
        if (window.KLabsEngine.cpu) {
          window.KLabsEngine.cpu.reset();
          window.KLabsEngine.cpu.isRunning = true;
        }

        // Menjalankan Master Loop Eksekusi
        if (window.KLabsEngine.execution) {
          window.KLabsEngine.execution.startLoop();
          console.log("[K-Labs Studio] Master Execution Loop berhasil diaktifkan!");
        } else {
          alert("Galat: Execution Engine tidak ditemukan di dalam memori!");
        }

      } catch (error) {
        // Menampilkan pesan error asli langsung ke layar HP Anda
        alert("DETAIL ERROR: " + error.message);
        console.error("[K-Labs Critical Error]:", error);
      }
    }
  </script>

  <!-- Panggil Core Engine Mandiri K-Labs -->
  <script src="core.js"></script>
</body>
</html>
