<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Labs Retro Engine Ultimate - Kialdevaro Group</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { 
      background: #030712; 
      color: #f8fafc; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      overflow-x: hidden; 
      padding-bottom: 20px;
    }
    .container { 
      max-width: 850px; 
      margin: 0 auto; 
      padding: 12px; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
    }
    .header-panel { 
      background: rgba(15, 23, 42, 0.9); 
      border: 1px solid rgba(0, 255, 204, 0.4); 
      border-radius: 14px; 
      padding: 14px; 
      backdrop-filter: blur(14px); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      box-shadow: 0 8px 32px rgba(0, 255, 204, 0.15);
    }
    .brand-title { 
      font-size: 15px; 
      font-weight: bold; 
      color: #00ffcc; 
      letter-spacing: 1.5px; 
    }
    .control-panel { 
      background: rgba(15, 23, 42, 0.95); 
      border: 1px solid rgba(0, 255, 204, 0.3); 
      border-radius: 14px; 
      padding: 14px; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
    }
    .file-group { 
      display: flex; 
      gap: 10px; 
      align-items: center; 
      justify-content: space-between; 
      font-size: 12px; 
      color: #94a3b8; 
    }
    .file-group input[type="file"] { 
      font-size: 11px; 
      color: #00ffcc; 
    }
    .btn-run { 
      background: linear-gradient(135deg, #00ffcc, #0088ff); 
      color: #030712; 
      border: none; 
      font-weight: bold; 
      padding: 12px 18px; 
      border-radius: 10px; 
      cursor: pointer; 
      text-align: center; 
      font-size: 14px; 
      transition: 0.2s; 
      box-shadow: 0 4px 25px rgba(0, 255, 204, 0.4);
    }
    .btn-run:hover { 
      opacity: 0.95; 
      transform: scale(1.01); 
    }

    /* Wadah Game Utama dengan Posisi Relatif untuk Floating Gamepad Overlay */
    #game {
      width: 100%;
      aspect-ratio: 4/3;
      background: #030712;
      border-radius: 14px;
      border: 1px solid rgba(0,255,204,0.5);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 40px rgba(0,255,204,0.1);
    }

    /* Gaya Floating Gamepad di Dalam Layar */
    .floating-overlay {
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      pointer-events: none;
      z-index: 100;
    }
    .floating-group {
      pointer-events: auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .virtual-btn {
      background: rgba(15, 23, 42, 0.75);
      color: #00ffcc;
      border: 1px solid rgba(0, 255, 204, 0.4);
      border-radius: 50%;
      width: 45px;
      height: 45px;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .virtual-btn:active {
      background: rgba(0, 255, 204, 0.4);
      color: #030712;
    }
    .dpad-container {
      width: 90px;
      height: 90px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 50%;
      border: 1px solid rgba(0, 255, 204, 0.3);
      position: relative;
      pointer-events: auto;
      backdrop-filter: blur(4px);
    }
    .dpad-btn {
      position: absolute;
      background: rgba(15, 23, 42, 0.85);
      color: #00ffcc;
      border: 1px solid rgba(0, 255, 204, 0.3);
      width: 28px;
      height: 28px;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .dpad-up { top: 4px; left: 31px; border-radius: 6px 6px 0 0; }
    .dpad-down { bottom: 4px; left: 31px; border-radius: 0 0 6px 6px; }
    .dpad-left { top: 31px; left: 4px; border-radius: 6px 0 0 6px; }
    .dpad-right { top: 31px; right: 4px; border-radius: 0 6px 6px 0; }
  </style>

  <!-- SCRIPT PERLINDUNGAN KODE SUMBER (ANTI-THEFT & ANTI-INSPECT) -->
  <script>
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
    document.addEventListener('keydown', function(e) {
      if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 65))) {
        e.preventDefault();
        return false;
      }
    });
  </script>
</head>
<body>
  <div class="container">
    <div class="header-panel">
      <div class="brand-title">K-LABS RETRO ENGINE // ULTIMATE</div>
      <div style="font-size: 11px; color: #38bdf8; font-weight: 600;">© 2026 Kialdevaro Group</div>
    </div>

    <div class="control-panel">
      <div class="file-group">
        <span>1. FILE BIOS PS1 (.bin):</span>
        <input type="file" id="biosFile">
      </div>
      <div class="file-group">
        <span>2. FILE GAME ROM (.bin/.iso):</span>
        <input type="file" id="romFile">
      </div>
      <button class="btn-run" onclick="bootMasterEngine()">▶ JALANKAN ULTIMATE ENGINE (WEBGL2)</button>
    </div>
    
    <!-- WADAH KANVAS GAME DENGAN FLOATING GAMEPAD OVERLAY (IKUT FULLSCREEN) -->
    <div id="game">
      <!-- Tombol Stik Virtual Melayang di Dalam Layar -->
      <div class="floating-overlay">
        <!-- D-Pad Kiri -->
        <div class="dpad-container">
          <div class="dpad-btn dpad-up" onmousedown="KLabsPressButton('UP', true)" onmouseup="KLabsPressButton('UP', false)" ontouchstart="KLabsPressButton('UP', true)" ontouchend="KLabsPressButton('UP', false)">▲</div>
          <div class="dpad-btn dpad-down" onmousedown="KLabsPressButton('DOWN', true)" onmouseup="KLabsPressButton('DOWN', false)" ontouchstart="KLabsPressButton('DOWN', true)" ontouchend="KLabsPressButton('DOWN', false)">▼</div>
          <div class="dpad-btn dpad-left" onmousedown="KLabsPressButton('LEFT', true)" onmouseup="KLabsPressButton('LEFT', false)" ontouchstart="KLabsPressButton('LEFT', true)" ontouchend="KLabsPressButton('LEFT', false)">◀</div>
          <div class="dpad-btn dpad-right" onmousedown="KLabsPressButton('RIGHT', true)" onmouseup="KLabsPressButton('RIGHT', false)" ontouchstart="KLabsPressButton('RIGHT', true)" ontouchend="KLabsPressButton('RIGHT', false)">▶</div>
        </div>

        <!-- Tombol Aksi Kanan (X, O, Square, Triangle) -->
        <div class="floating-group" style="display: grid; grid-template-columns: repeat(2, 42px); gap: 6px;">
          <button class="virtual-btn" onmousedown="KLabsPressButton('SQUARE', true)" onmouseup="KLabsPressButton('SQUARE', false)" ontouchstart="KLabsPressButton('SQUARE', true)" ontouchend="KLabsPressButton('SQUARE', false)">□</button>
          <button class="virtual-btn" onmousedown="KLabsPressButton('TRIANGLE', true)" onmouseup="KLabsPressButton('TRIANGLE', false)" ontouchstart="KLabsPressButton('TRIANGLE', true)" ontouchend="KLabsPressButton('TRIANGLE', false)">△</button>
          <button class="virtual-btn" onmousedown="KLabsPressButton('CROSS', true)" onmouseup="KLabsPressButton('CROSS', false)" ontouchstart="KLabsPressButton('CROSS', true)" ontouchend="KLabsPressButton('CROSS', false)">✕</button>
          <button class="virtual-btn" onmousedown="KLabsPressButton('CIRCLE', true)" onmouseup="KLabsPressButton('CIRCLE', false)" ontouchstart="KLabsPressButton('CIRCLE', true)" ontouchend="KLabsPressButton('CIRCLE', false)">◯</button>
        </div>
      </div>
    </div>

    <!-- Tombol Fitur Pro & Manajemen Penyimpanan Internal -->
    <div style="display: flex; gap: 6px;">
      <button onclick="document.getElementById('game').requestFullscreen()" style="flex:1; background:#1e293b; color:#00ffcc; border:1px solid #00ffcc44; border-radius:8px; padding:8px; font-size:10px; cursor:pointer; font-weight:bold;">⛶ FULL</button>
      <button id="btn-fps-toggle" onclick="toggleFPSMode(this)" style="flex:1; background:#1e293b; color:#38bdf8; border:1px solid #38bdf844; border-radius:8px; padding:8px; font-size:10px; cursor:pointer; font-weight:bold;">⚡ UNLOCK</button>
      <button onclick="if(window.KLabsEngine && window.KLabsEngine.advanced) window.KLabsEngine.advanced.exportSaveFile()" style="flex:1; background:#1e293b; color:#10b981; border:1px solid #10b98144; border-radius:8px; padding:8px; font-size:10px; cursor:pointer; font-weight:bold;">💾 EXPORT</button>
      <button onclick="document.getElementById('importSaveInput').click()" style="flex:1; background:#1e293b; color:#f59e0b; border:1px solid #f59e0b44; border-radius:8px; padding:8px; font-size:10px; cursor:pointer; font-weight:bold;">📂 IMPORT</button>
      <input type="file" id="importSaveInput" style="display:none" onchange="if(window.KLabsEngine && window.KLabsEngine.advanced) window.KLabsEngine.advanced.importSaveFile(this)">
    </div>
  </div>

  <script>
    function toggleFPSMode(btn) {
      if (window.KLabsEngine) {
        const newState = !window.KLabsEngine.profile.unlockedFPS;
        window.KLabsEngine.toggleUnlimitedFPS(newState);
        btn.textContent = newState ? "⚡ UNLOCK" : "🔒 60 FPS";
        btn.style.color = newState ? "#38bdf8" : "#fACC15";
      }
    }

    async function bootMasterEngine() {
      try {
        const biosInput = document.getElementById('biosFile');
        const romInput = document.getElementById('romFile');

        if (!biosInput.files[0]) {
          alert("Harap pilih file BIOS PS1 (.bin) terlebih dahulu!");
          return;
        }
        if (!romInput.files[0]) {
          alert("Harap pilih file Game ROM (.bin/.iso) terlebih dahulu!");
          return;
        }

        if (!window.KLabsEngine || !window.KLabsEngine.loader) {
           alert("Galat: Core Engine belum sepenuhnya terhubung!");
           return;
        }

        await window.KLabsEngine.loader.loadBIOS(biosInput.files[0]);
        await window.KLabsEngine.loader.loadROM(romInput.files[0]);

        if (window.KLabsEngine.cpu) {
          window.KLabsEngine.cpu.reset();
          window.KLabsEngine.cpu.isRunning = true;
        }

        if (window.KLabsEngine.execution) {
          window.KLabsEngine.execution.startLoop();
        }
      } catch (error) {
        alert("DETAIL ERROR: " + error.message);
      }
    }
  </script>

  <!-- Pemuat Inti Otomatis -->
  <script>
    (function() {
      const script = document.createElement('script');
      const pathname = window.location.pathname;
      const isGitHubPages = window.location.hostname.includes('github.io');
      let basePath = isGitHubPages && pathname.includes('/K-Labs/') ? '/K-Labs/' : './';
      script.src = basePath + 'core.js?v=' + Date.now();
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
