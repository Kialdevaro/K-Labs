<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Labs - Kialdevaro Labs</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: rgb(17, 24, 39);
      border: 1px solid rgb(55, 65, 81);
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h1 { color: #00ffcc; font-size: 22px; margin-bottom: 10px; }
    p { color: #d1d5db; font-size: 14px; line-height: 1.6; }
    .badge {
      display: inline-block;
      background: rgba(0, 255, 204, 0.15);
      color: #00ffcc;
      border: 1px solid #00ffcc;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>K-Labs (Kialdevaro Labs)</h1>
    <p>Pusat riset, inovasi, dan pengembangan perangkat lunak mutakhir di bawah ekosistem Kialdevaro Group.</p>
    <div class="badge">System Online & Ready</div>
  </div>
</body>
</html>
