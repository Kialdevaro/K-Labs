<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K-Labs Retro Engine Ultimate v5.0 | Kialdevaro Group</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; background: #050505; color: #00ffcc;
            font-family: monospace; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }
        /* Menu Utama Overlay */
        #main-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.95); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px;
        }
        #main-menu h1 { color: #00ffcc; font-size: 22px; margin-bottom: 5px; text-align: center; text-shadow: 0 0 10px rgba(0,255,204,0.5); }
        #main-menu p { color: #888; font-size: 12px; margin-bottom: 20px; }
        .menu-btn {
            background: #111; border: 2px solid #00ffcc; color: #00ffcc;
            padding: 12px 25px; margin: 8px; width: 80%; max-width: 280px;
            font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,255,204,0.2); transition: 0.2s;
        }
        .menu-btn:active { background: #00ffcc; color: #000; }
        
        /* Area Game & Canvas */
        #game-container {
            flex: 1; display: flex; justify-content: center; align-items: center;
            background: #000; position: relative; width: 100%; max-height: 55vh;
        }
        #klabs-render-surface {
            width: 100%; height: 100%; object-fit: contain; background: #000;
        }

        /* Virtual Gamepad Penuh */
        #virtual-gamepad {
            height: 45vh; background: #0c0c0c; border-top: 2px solid #222;
            display: grid; grid-template-columns: 1fr 1fr; position: relative;
            padding: 10px;
        }
        .pad-group { display: flex; justify-content: center; align-items: center; position: relative; }
        
        /* D-Pad Style */
        .dpad { width: 130px; height: 130px; position: relative; }
        .d-btn {
            position: absolute; background: #1a1a1a; border: 1px solid #333; color: #00ffcc;
            display: flex; justify-content: center; align-items: center; font-weight: bold;
            font-size: 16px; cursor: pointer; active { background: #00ffcc; color: #000; }
        }
        .d-up { top: 0; left: 40px; width: 50px; height: 45px; border-radius: 6px 6px 0 0; }
        .d-down { bottom: 0; left: 40px; width: 50px; height: 45px; border-radius: 0 0 6px 6px; }
        .d-left { top: 40px; left: 0; width: 45px; height: 50px; border-radius: 6px 0 0 6px; }
        .d-right { top: 40px; right: 0; width: 45px; height: 50px; border-radius: 0 6px 6px 0; }

        /* Action Buttons Style (PS1 Shapes) */
        .actions { width: 140px; height: 140px; position: relative; }
        .act-btn {
            position: absolute; width: 40px; height: 40px; border-radius: 50%;
            border: 2px solid #00ffcc; background: #111; color: #00ffcc;
            display: flex; justify-content: center; align-items: center; font-weight: bold;
            font-size: 12px; cursor: pointer;
        }
        .btn-triangle { top: 0; left: 50px; border-color: #00ffcc; }
        .btn-square { top: 50px; left: 0; border-color: #ff0055; color: #ff0055; }
        .btn-circle { top: 50px; right: 0; border-color: #ffaa00; color: #ffaa00; }
        .btn-cross { bottom: 0; left: 50px; border-color: #0088ff; color: #0088ff; }

        /* Center Control (Start, Select, Menu) */
        .center-controls {
            position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px;
        }
        .ctrl-sub-btn {
            background: #151515; border: 1px solid #444; color: #aaa;
            padding: 4px 12px; font-size: 10px; border-radius: 4px; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- MENU UTAMA DENGAN BERBAGAI FITUR -->
    <div id="main-menu">
        <h1>K-LABS RETRO ENGINE</h1>
        <p>Kialdevaro Group - PS1 Web Engine v5.0</p>
        <button class="menu-btn" onclick="startEngine('ps1')">▶ Mulai Game PS1</button>
        <button class="menu-btn" onclick="openFeature('rom')">📂 Unggah / Pilih ROM</button>
        <button class="menu-btn" onclick="openFeature('settings')">⚙ Pengaturan Grafis (ACES)</button>
        <button class="menu-btn" onclick="openFeature('about')">ℹ Tentang K-Labs</button>
    </div>

    <!-- AREA RENDER GAME -->
    <div id="game-container">
        <canvas id="klabs-render-surface"></canvas>
    </div>

    <!-- GAMEPAD VIRTUAL PENUH DI BAHAN LAYAR -->
    <div id="virtual-gamepad">
        <div class="center-controls">
            <button class="ctrl-sub-btn" data-key="SELECT">SELECT</button>
            <button class="ctrl-sub-btn" data-key="START">START</button>
            <button class="ctrl-sub-btn" onclick="returnToMenu()">MENU</button>
        </div>
        
        <!-- D-PAD (Kiri) -->
        <div class="pad-group">
            <div class="dpad">
                <div class="d-btn d-up" data-key="UP">▲</div>
                <div class="d-btn d-down" data-key="DOWN">▼</div>
                <div class="d-btn d-left" data-key="LEFT">◀</div>
                <div class="d-btn d-right" data-key="RIGHT">▶</div>
            </div>
        </div>

        <!-- TOMBOL AKSI PS1 (Kanan) -->
        <div class="pad-group">
            <div class="actions">
                <div class="act-btn btn-triangle" data-key="TRIANGLE">△</div>
                <div class="act-btn btn-square" data-key="SQUARE">□</div>
                <div class="act-btn btn-circle" data-key="CIRCLE">○</div>
                <div class="act-btn btn-cross" data-key="CROSS">✕</div>
            </div>
        </div>
    </div>

    <script type="module" src="core.js"></script>
</body>
</html>
