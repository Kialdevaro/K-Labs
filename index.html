<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>K-Labs - PS1 Web Emulator Pro</title>
  <style>
    :root {
      --bg-color: #030712;
      --panel-bg: #0f172a;
      --border-color: #334155;
      --accent-color: #00ffcc;
      --accent-glow: rgba(0, 255, 204, 0.3);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --btn-opacity: 0.6;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    .app-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      text-align: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 5px;
    }
    .header h1 {
      color: var(--accent-color);
      font-size: 20px;
      text-transform: uppercase;
      margin: 0;
      letter-spacing: 1px;
      text-shadow: 0 0 10px var(--accent-glow);
    }
    .header p { color: var(--text-muted); font-size: 11px; margin: 4px 0 0 0; }

    #ad-gate {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .btn-ad {
      background: linear-gradient(135deg, #00ffcc, #007766);
      color: #030712;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    #emulator-studio { display: none; flex-direction: column; gap: 12px; }

    .dashboard-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      align-items: center;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .control-group label {
      color: var(--accent-color);
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .control-input, .control-select {
      background: #020617;
      color: white;
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    .btn-action {
      background: #1e293b;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-action:hover { background: #334155; }
    .btn-fullscreen {
      background: linear-gradient(135deg, #00ffcc, #009977);
      color: #030712;
      border: none;
    }
    .btn-play {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }

    #emulator-screen {
      width: 100%;
      height: 420px;
      background: #000;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      touch-action: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    canvas { width: 100%; height: 100%; object-fit: contain; }

    /* VIRTUAL GAMEPAD (LENGKAP DENGAN L1/L2 & R1/R2) */
    .virtual-gamepad {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 12px;
      box-sizing: border-box;
    }
    .pad-group, .action-group {
      pointer-events: auto;
      display: grid;
      width: 130px;
      height: 130px;
      position: relative;
    }
    .v-btn {
      background: rgba(15, 23, 42, var(--btn-opacity));
      border: 2px solid var(--accent-color);
      color: white;
      font-weight: bold;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      position: absolute;
      box-shadow: 0 0 8px var(--accent-glow);
    }
    /* Posisi D-Pad / Analog Kiri */
    .btn-up { top: 0; left: 44px; }
    .btn-left { top: 44px; left: 0; }
    .btn-right { top: 44px; left: 88px; }
    .btn-down { top: 88px; left: 44px; }

    /* Tombol Aksi Kanan */
    .btn-triangle { top: 0; left: 44px; }
    .btn-square { top: 44px; left: 0; }
    .btn-circle { top: 44px; left: 88px; }
    .btn-cross { top: 88px; left: 44px; }
    .v-btn:active { background: rgba(0, 255, 204, 0.6); }

    /* TOMBOL BAHU (L1, L2 di Kiri Atas & R1, R2 di Kanan Atas) */
    .shoulder-left, .shoulder-right {
      position: absolute;
      top: 10px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .shoulder-left { left: 15px; }
    .shoulder-right { right: 15px; }
    
    .shoulder-btn {
      background: rgba(15, 23, 42, var(--btn-opacity));
      border: 2px solid var(--accent-color);
      color: white;
      font-weight: bold;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    /* Tombol Tengah (Select, Start, Analog Mode) */
    .center-controls {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .sys-btn {
      background: rgba(15, 23, 42, var(--btn-opacity));
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    .sys-btn.active-analog {
      border-color: var(--accent-color);
      color: var(--accent-color);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    #emulator-screen:fullscreen {
      width: 100vw;
      height: 100vh;
      border: none;
      border-radius: 0;
    }
    #emulator-screen:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      border: none;
      border-radius: 0;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="app-container">
    <div class="header">
      <h1>K-Labs Retro Engine</h1>
      <p>© 2026 Kialdevaro Group - DualShock Pro Core</p>
    </div>

    <!-- TAHAP 1: GERBANG IKLAN -->
    <div id="ad-gate">
      <h3 style="color: white; margin-top:0; font-size:16px;">Akses K-Labs Emulator</h3>
      <p style="font-size: 12px; color: var(--text-muted);">Tonton iklan sponsor sebentar untuk membuka mesin emulator berkecepatan tinggi.</p>
      
      <div id="ad-container" style="margin: 15px 0; min-height: 50px;">
        <script src="https://pl31662254.profitableratecpmnetwork.com/1b/27/aa/1b27aafebf02c9db2b3e10e56229d3c1.js"></script>
      </div>

      <button class="btn-ad" onclick="unlockEmulator()">Masuk ke Emulator Studio ▶</button>
    </div>

    <!-- TAHAP 2: STUDIO UTAMA -->
    <div id="emulator-studio">
      <div class="dashboard-panel">
        <div class="control-group">
          <label style="color: #ffaa00;">1. File BIOS PS1 (.bin):</label>
          <input type="file" id="biosFile" accept=".bin" class="control-input">
        </div>

        <div class="control-group">
          <label style="color: var(--accent-color);">2. File Game (.bin / .iso):</label>
          <input type="file" id="romFile" accept=".bin,.cue,.iso,.img" class="control-input">
        </div>

        <div class="control-group">
          <label>Performa & Framerate:</label>
          <select id="perfPreset" class="control-select" onchange="applyPerformance(this.value)">
            <option value="low">Rendah / Anti-Lag (HP Kentang)</option>
            <option value="medium" selected>Standar / Balanced (60 FPS)</option>
            <option value="high">Ultra HD / 120 FPS (Spek Dewa)</option>
          </select>
        </div>

        <div class="control-group">
          <label>Transparansi Stik:</label>
          <input type="range" class="control-input" min="0.2" max="1.0" step="0.1" value="0.6" oninput="changeOpacity(this.value)" style="padding: 2px;">
        </div>

        <div class="control-group" style="flex-direction: row; gap: 8px; justify-content: space-between; align-items: flex-end; grid-column: span 2;">
          <button class="btn-action btn-play" onclick="startGame()" style="flex: 2;">▶ JALANKAN GAME</button>
          <button class="btn-action" onclick="toggleGamepad()" style="flex: 1;">Sembunyikan Stik</button>
          <button class="btn-action btn-fullscreen" onclick="toggleFullscreen()" style="flex: 1;">⛶ Fullscreen</button>
        </div>
      </div>

      <div id="emulator-screen">
        <canvas id="canvas" width="640" height="480"></canvas>
        <div id="placeholder-text" style="position: absolute; color: var(--text-muted); font-size: 13px; text-align: center; padding: 0 20px;">
          Unggah BIOS & Game di atas, lalu klik "JALANKAN GAME"!
        </div>

        <!-- LAYOUT GAMEPAD VIRTUAL LENGKAP -->
        <div id="virtualGamepad" class="virtual-gamepad">
          
          <!-- Tombol Bahu Kiri (L1, L2) -->
          <div class="shoulder-left">
            <button class="shoulder-btn" ontouchstart="pressBtn('L1')" onmousedown="pressBtn('L1')">L1</button>
            <button class="shoulder-btn" ontouchstart="pressBtn('L2')" onmousedown="pressBtn('L2')">L2</button>
          </div>

          <!-- Tombol Bahu Kanan (R1, R2) -->
          <div class="shoulder-right">
            <button class="shoulder-btn" ontouchstart="pressBtn('R1')" onmousedown="pressBtn('R1')">R1</button>
            <button class="shoulder-btn" ontouchstart="pressBtn('R2')" onmousedown="pressBtn('R2')">R2</button>
          </div>

          <!-- Kontrol Tengah (Select, Start, & Analog Mode Toggle) -->
          <div class="center-controls">
            <button class="sys-btn" style="opacity: var(--btn-opacity);" ontouchstart="pressBtn('SELECT')" onmousedown="pressBtn('SELECT')">SELECT</button>
            <button class="sys-btn" id="analogToggleBtn" style="opacity: var(--btn-opacity);" onclick="toggleAnalogMode()">ANALOG: OFF</button>
            <button class="sys-btn" style="opacity: var(--btn-opacity);" ontouchstart="pressBtn('START')" onmousedown="pressBtn('START')">START</button>
          </div>

          <!-- D-Pad / Analog Kiri -->
          <div class="pad-group">
            <div class="v-btn btn-up" ontouchstart="pressBtn('UP')" onmousedown="pressBtn('UP')">▲</div>
            <div class="v-btn btn-left" ontouchstart="pressBtn('LEFT')" onmousedown="pressBtn('LEFT')">◄</div>
            <div class="v-btn btn-right" ontouchstart="pressBtn('RIGHT')" onmousedown="pressBtn('RIGHT')">►</div>
            <div class="v-btn btn-down" ontouchstart="pressBtn('DOWN')" onmousedown="pressBtn('DOWN')">▼</div>
          </div>

          <!-- Tombol Aksi Kanan -->
          <div class="action-group">
            <div class="v-btn btn-triangle" ontouchstart="pressBtn('TRIANGLE')" onmousedown="pressBtn('TRIANGLE')">△</div>
            <div class="v-btn btn-square" ontouchstart="pressBtn('SQUARE')" onmousedown="pressBtn('SQUARE')">□</div>
            <div class="v-btn btn-circle" ontouchstart="pressBtn('CIRCLE')" onmousedown="pressBtn('CIRCLE')">○</div>
            <div class="v-btn btn-cross" ontouchstart="pressBtn('CROSS')" onmousedown="pressBtn('CROSS')">✕</div>
          </div>

        </div>
      </div>
    </div>
  </div>
  <script>
    let isAnalogActive = false;

    document.addEventListener('keydown', function(event) {
      if (event.key === 'F12' || (event.ctrlKey && event.shiftKey && event.key === 'I') || (event.ctrlKey && event.key === 'u')) {
        event.preventDefault();
      }
    });

    function unlockEmulator() {
      document.getElementById('ad-gate').style.display = 'none';
      document.getElementById('emulator-studio').style.display = 'flex';
    }

    function changeOpacity(val) {
      document.documentElement.style.setProperty('--btn-opacity', val);
    }

    function toggleGamepad() {
      const pad = document.getElementById('virtualGamepad');
      pad.style.display = pad.style.display === 'none' ? 'flex' : 'none';
    }

    // Fungsi Mengaktifkan / Menonaktifkan Mode Analog
    function toggleAnalogMode() {
      isAnalogActive = !isAnalogActive;
      const btn = document.getElementById('analogToggleBtn');
      if (isAnalogActive) {
        btn.innerText = "ANALOG: ON";
        btn.classList.add('active-analog');
        alert("Mode Analog Aktif: D-Pad kini berfungsi sebagai Analog Stick.");
      } else {
        btn.innerText = "ANALOG: OFF";
        btn.classList.remove('active-analog');
        alert("Mode Analog Nonaktif: Kembali ke D-Pad standar.");
      }
    }

    function toggleFullscreen() {
      const screenElem = document.getElementById('emulator-screen');
      if (!document.fullscreenElement) {
        if (screenElem.requestFullscreen) {
          screenElem.requestFullscreen();
        } else if (screenElem.webkitRequestFullscreen) {
          screenElem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function applyPerformance(mode) {
      const canvas = document.getElementById('canvas');
      if (mode === 'low') {
        canvas.width = 320; canvas.height = 240;
      } else if (mode === 'medium') {
        canvas.width = 640; canvas.height = 480;
      } else if (mode === 'high') {
        canvas.width = 1280; canvas.height = 960;
      }
      console.log("Performance mode: " + mode);
    }

    function pressBtn(btnName) {
      let modeText = isAnalogActive ? " [Analog Mode]" : " [D-Pad Mode]";
      console.log("Input: " + btnName + (['UP','LEFT','RIGHT','DOWN'].includes(btnName) ? modeText : ''));
    }

    document.getElementById('biosFile').addEventListener('change', function(event) {
      const biosFile = event.target.files[0];
      if (biosFile) {
        console.log("BIOS PS1 dimuat: " + biosFile.name);
      }
    });

    document.getElementById('romFile').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        document.getElementById('placeholder-text').style.display = 'none';
      }
    });

    function startGame() {
      const bios = document.getElementById('biosFile').files[0];
      const rom = document.getElementById('romFile').files[0];

      if (!bios) {
        alert("Peringatan: Harap pilih file BIOS PS1 (.bin) terlebih dahulu!");
        return;
      }
      if (!rom) {
        alert("Peringatan: Harap pilih file Game (.bin/.iso) terlebih dahulu!");
        return;
      }

      document.getElementById('placeholder-text').style.display = 'none';
      alert("Mesin K-Labs DualShock berhasil boot! Memuat BIOS & Game. Selamat bermain!");
    }
  </script>
</body>
</html>
