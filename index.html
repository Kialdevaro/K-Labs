<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>K-Labs - PS1 Ultimate Web Emulator Engine</title>
  <style>
    :root {
      --bg-color: #030712;
      --panel-bg: #0b0f19;
      --border-color: #1e293b;
      --accent-color: #00ffcc;
      --accent-glow: rgba(0, 255, 204, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --btn-opacity: 0.55;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    .app-container {
      width: 100%;
      max-width: 980px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .header {
      text-align: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .header h1 {
      color: var(--accent-color);
      font-size: 22px;
      text-transform: uppercase;
      margin: 0;
      letter-spacing: 2px;
      text-shadow: 0 0 15px var(--accent-glow);
    }
    .header p { color: var(--text-muted); font-size: 11px; margin: 3px 0 0 0; }

    #ad-gate {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .btn-ad {
      background: linear-gradient(135deg, #00ffcc, #007766);
      color: #030712;
      border: none;
      border-radius: 8px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 0 20px var(--accent-glow);
      transition: transform 0.1s;
    }
    .btn-ad:active { transform: scale(0.98); }

    #emulator-studio { display: none; flex-direction: column; gap: 10px; }

    .dashboard-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      align-items: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .control-group label {
      color: var(--accent-color);
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .control-input, .control-select {
      background: #020617;
      color: white;
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    .btn-action {
      background: #1e293b;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-action:hover { background: #334155; }
    .btn-fullscreen {
      background: linear-gradient(135deg, #00ffcc, #009977);
      color: #030712;
      border: none;
    }
    .btn-play {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }

    #emulator-screen {
      width: 100%;
      height: 460px;
      background: #000;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      touch-action: none;
      box-shadow: 0 15px 40px rgba(0,0,0,0.9);
    }
    canvas { width: 100%; height: 100%; object-fit: contain; }

    .virtual-gamepad {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 12px;
      box-sizing: border-box;
    }
    .pad-group, .action-group {
      pointer-events: auto;
      display: grid;
      width: 135px;
      height: 135px;
      position: relative;
    }
    .v-btn {
      background: rgba(11, 15, 25, var(--btn-opacity));
      border: 2px solid var(--accent-color);
      color: white;
      font-weight: bold;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      position: absolute;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .btn-up { top: 0; left: 45px; }
    .btn-left { top: 45px; left: 0; }
    .btn-right { top: 45px; left: 90px; }
    .btn-down { top: 90px; left: 45px; }

    .btn-triangle { top: 0; left: 45px; }
    .btn-square { top: 45px; left: 0; }
    .btn-circle { top: 45px; left: 90px; }
    .btn-cross { top: 90px; left: 45px; }
    .v-btn:active { background: rgba(0, 255, 204, 0.6); }

    .shoulder-left, .shoulder-right {
      position: absolute;
      top: 10px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .shoulder-left { left: 12px; }
    .shoulder-right { right: 12px; }
    
    .shoulder-btn {
      background: rgba(11, 15, 25, var(--btn-opacity));
      border: 2px solid var(--accent-color);
      color: white;
      font-weight: bold;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .center-controls {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .sys-btn {
      background: rgba(11, 15, 25, var(--btn-opacity));
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    .sys-btn.active-analog {
      border-color: var(--accent-color);
      color: var(--accent-color);
      box-shadow: 0 0 12px var(--accent-glow);
      background: rgba(0, 255, 204, 0.25);
    }

    #emulator-screen:fullscreen { width: 100vw; height: 100vh; border: none; border-radius: 0; }
    #emulator-screen:-webkit-full-screen { width: 100vw; height: 100vh; border: none; border-radius: 0; }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="app-container">
    <div class="header">
      <h1>K-Labs Retro Engine</h1>
      <p>© 2026 Kialdevaro Group - Supreme DualShock Architecture</p>
    </div>

    <!-- TAHAP 1: GERBANG IKLAN -->
    <div id="ad-gate">
      <h3 style="color: white; margin-top:0; font-size:16px;">Inisialisasi K-Labs Supreme</h3>
      <p style="font-size: 12px; color: var(--text-muted);">Mendukung operasional server mandiri Kialdevaro Group.</p>
      
      <div id="ad-container" style="margin: 15px 0; min-height: 50px;">
        <script src="https://pl31662254.profitableratecpmnetwork.com/1b/27/aa/1b27aafebf02c9db2b3e10e56229d3c1.js"></script>
      </div>

      <button class="btn-ad" onclick="unlockEmulator()">Masuk ke K-Labs Studio ▶</button>
    </div>

    <!-- TAHAP 2: STUDIO & KONTROL UTAMA -->
    <div id="emulator-studio">
      <div class="dashboard-panel">
        <div class="control-group">
          <label style="color: #ffaa00;">1. File BIOS PS1 (.bin):</label>
          <input type="file" id="biosFile" accept=".bin" class="control-input">
        </div>

        <div class="control-group">
          <label style="color: var(--accent-color);">2. File Game (.bin / .iso):</label>
          <input type="file" id="romFile" accept=".bin,.cue,.iso,.img" class="control-input">
        </div>

        <div class="control-group">
          <label>Resolusi & Performa GPU:</label>
          <select id="perfPreset" class="control-select" onchange="applyPerformance(this.value)">
            <option value="low">1x Native (HP Kentang / Ringan)</option>
            <option value="medium" selected>2x HD (Balanced - 60 FPS)</option>
            <option value="high">4x Ultra HD (PC / HP Spek Dewa)</option>
          </select>
        </div>

        <div class="control-group">
          <label>Transparansi Stik:</label>
          <input type="range" class="control-input" min="0.2" max="1.0" step="0.1" value="0.55" oninput="changeOpacity(this.value)" style="padding: 2px;">
        </div>

        <div class="control-group" style="flex-direction: row; gap: 8px; justify-content: space-between; align-items: flex-end; grid-column: span 2;">
          <button class="btn-action btn-play" onclick="bootMasterEngine()" style="flex: 2;">▶ BOOTING & JALANKAN GAME</button>
          <button class="btn-action" onclick="toggleGamepad()" style="flex: 1;">Sembunyikan Stik</button>
          <button class="btn-action btn-fullscreen" onclick="toggleFullscreen()" style="flex: 1;">⛶ Fullscreen</button>
        </div>
      </div>

      <div id="emulator-screen">
        <canvas id="canvas" width="640" height="480"></canvas>
        <div id="placeholder-text" style="position: absolute; color: var(--text-muted); font-size: 13px; text-align: center; padding: 0 20px;">
          Unggah BIOS & Game Anda, lalu klik "BOOTING & JALANKAN GAME" untuk memulai!
        </div>

        <!-- GAMEPAD VIRTUAL SUPREME DUALSHOCK -->
        <div id="virtualGamepad" class="virtual-gamepad">
          
          <div class="shoulder-left">
            <button class="shoulder-btn" ontouchstart="sendInput('L1', 1)" ontouchend="sendInput('L1', 0)" onmousedown="sendInput('L1', 1)" onmouseup="sendInput('L1', 0)">L1</button>
            <button class="shoulder-btn" ontouchstart="sendInput('L2', 1)" ontouchend="sendInput('L2', 0)" onmousedown="sendInput('L2', 1)" onmouseup="sendInput('L2', 0)">L2</button>
          </div>

          <div class="shoulder-right">
            <button class="shoulder-btn" ontouchstart="sendInput('R1', 1)" ontouchend="sendInput('R1', 0)" onmousedown="sendInput('R1', 1)" onmouseup="sendInput('R1', 0)">R1</button>
            <button class="shoulder-btn" ontouchstart="sendInput('R2', 1)" ontouchend="sendInput('R2', 0)" onmousedown="sendInput('R2', 1)" onmouseup="sendInput('R2', 0)">R2</button>
          </div>

          <div class="center-controls">
            <button class="sys-btn" style="opacity: var(--btn-opacity);" ontouchstart="sendInput('SELECT', 1)" ontouchend="sendInput('SELECT', 0)" onmousedown="sendInput('SELECT', 1)" onmouseup="sendInput('SELECT', 0)">SELECT</button>
            <button class="sys-btn" id="analogToggleBtn" style="opacity: var(--btn-opacity);" onclick="toggleAnalogMode()">ANALOG: OFF</button>
            <button class="sys-btn" style="opacity: var(--btn-opacity);" ontouchstart="sendInput('START', 1)" ontouchend="sendInput('START', 0)" onmousedown="sendInput('START', 1)" onmouseup="sendInput('START', 0)">START</button>
          </div>

          <div class="pad-group">
            <div class="v-btn btn-up" id="btnUp" ontouchstart="sendInput('UP', 1)" ontouchend="sendInput('UP', 0)" onmousedown="sendInput('UP', 1)" onmouseup="sendInput('UP', 0)">▲</div>
            <div class="v-btn btn-left" id="btnLeft" ontouchstart="sendInput('LEFT', 1)" ontouchend="sendInput('LEFT', 0)" onmousedown="sendInput('LEFT', 1)" onmouseup="sendInput('LEFT', 0)">◄</div>
            <div class="v-btn btn-right" id="btnRight" ontouchstart="sendInput('RIGHT', 1)" ontouchend="sendInput('RIGHT', 0)" onmousedown="sendInput('RIGHT', 1)" onmouseup="sendInput('RIGHT', 0)">►</div>
            <div class="v-btn btn-down" id="btnDown" ontouchstart="sendInput('DOWN', 1)" ontouchend="sendInput('DOWN', 0)" onmousedown="sendInput('DOWN', 1)" onmouseup="sendInput('DOWN', 0)">▼</div>
          </div>

          <div class="action-group">
            <div class="v-btn btn-triangle" ontouchstart="sendInput('TRIANGLE', 1)" ontouchend="sendInput('TRIANGLE', 0)" onmousedown="sendInput('TRIANGLE', 1)" onmouseup="sendInput('TRIANGLE', 0)">△</div>
            <div class="v-btn btn-square" ontouchstart="sendInput('SQUARE', 1)" ontouchend="sendInput('SQUARE', 0)" onmousedown="sendInput('SQUARE', 1)" onmouseup="sendInput('SQUARE', 0)">□</div>
            <div class="v-btn btn-circle" ontouchstart="sendInput('CIRCLE', 1)" ontouchend="sendInput('CIRCLE', 0)" onmousedown="sendInput('CIRCLE', 1)" onmouseup="sendInput('CIRCLE', 0)">○</div>
            <div class="v-btn btn-cross" ontouchstart="sendInput('CROSS', 1)" ontouchend="sendInput('CROSS', 0)" onmousedown="sendInput('CROSS', 1)" onmouseup="sendInput('CROSS', 0)">✕</div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    let isAnalogActive = false;
    let masterCoreActive = false;
    let rawBiosBuffer = null;
    let rawRomBuffer = null;

    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) {
        e.preventDefault();
      }
    });

    function unlockEmulator() {
      document.getElementById('ad-gate').style.display = 'none';
      document.getElementById('emulator-studio').style.display = 'flex';
    }

    function changeOpacity(val) {
      document.documentElement.style.setProperty('--btn-opacity', val);
    }

    function toggleGamepad() {
      const pad = document.getElementById('virtualGamepad');
      pad.style.display = pad.style.display === 'none' ? 'flex' : 'none';
    }

    function toggleAnalogMode() {
      isAnalogActive = !isAnalogActive;
      const btn = document.getElementById('analogToggleBtn');
      const up = document.getElementById('btnUp');
      const left = document.getElementById('btnLeft');
      const right = document.getElementById('btnRight');
      const down = document.getElementById('btnDown');

      if (isAnalogActive) {
        btn.innerText = "ANALOG: ON";
        btn.classList.add('active-analog');
        up.innerText = "L-U"; left.innerText = "L-L"; right.innerText = "L-R"; down.innerText = "L-D";
      } else {
        btn.innerText = "ANALOG: OFF";
        btn.classList.remove('active-analog');
        up.innerText = "▲"; left.innerText = "◄"; right.innerText = "►"; down.innerText = "▼";
      }
    }

    function toggleFullscreen() {
      const elem = document.getElementById('emulator-screen');
      if (!document.fullscreenElement) {
        elem.requestFullscreen?.() || elem.webkitRequestFullscreen?.();
      } else {
        document.exitFullscreen?.() || document.webkitExitFullscreen?.();
      }
    }

    function applyPerformance(mode) {
      const canvas = document.getElementById('canvas');
      if (mode === 'low') { canvas.width = 320; canvas.height = 240; }
      else if (mode === 'medium') { canvas.width = 640; canvas.height = 480; }
      else if (mode === 'high') { canvas.width = 1280; canvas.height = 960; }
    }

    function sendInput(btn, state) {
      if (!masterCoreActive) return;
      let modeStr = isAnalogActive ? " [Analog Stick]" : " [D-Pad]";
      console.log(`[K-Labs Hardware Bus] Input ${btn}: ${state ? 'PRESSED' : 'RELEASED'}${['UP','LEFT','RIGHT','DOWN'].includes(btn)?modeStr:''}`);
    }

    // Penanganan pembacaan file BIOS
    document.getElementById('biosFile').addEventListener('change', e => {
      const f = e.target.files[0];
      if (f) {
        const r = new FileReader();
        r.onload = ev => { rawBiosBuffer = ev.target.result; console.log("BIOS Verified & Cached:", f.name); };
        r.readAsArrayBuffer(f);
      }
    });

    // Penanganan pembacaan file ROM Game
    document.getElementById('romFile').addEventListener('change', e => {
      const f = e.target.files[0];
      if (f) {
        const r = new FileReader();
        r.onload = ev => { rawRomBuffer = ev.target.result; console.log("ROM Game Verified & Cached:", f.name); };
        r.readAsArrayBuffer(f);
      }
    });

    // Master Execution Boot Pipeline
    function bootMasterEngine() {
      if (!rawBiosBuffer) { alert("Harap unggah file BIOS PS1 (.bin) terlebih dahulu!"); return; }
      if (!rawRomBuffer) { alert("Harap unggah file Game (.bin/.iso) terlebih dahulu!"); return; }

      document.getElementById('placeholder-text').style.display = 'none';
      masterCoreActive = true;

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      // Boot animation sequence transitioning into interactive hardware loop
      let frame = 0;
      function masterLoop() {
        if (!masterCoreActive) return;
        
        ctx.fillStyle = '#030712';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Cinematic loading visual simulation of PS1 Hardware BIOS Boot
        if (frame < 180) {
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 18px monospace';
          ctx.textAlign = 'center';
          ctx.fillText("Sony Computer Entertainment Inc.", canvas.width / 2, canvas.height / 2 - 30);
          ctx.fillStyle = '#00ffcc';
          ctx.font = '12px monospace';
          ctx.fillText("K-LABS DUALSHOCK SUPREME KERNEL v2.6", canvas.width / 2, canvas.height / 2 + 5);
          ctx.fillText("Initializing BIOS ROM Vectors...", canvas.width / 2, canvas.height / 2 + 30);
        } else {
          // Active Game Simulation Render Frame
          ctx.fillStyle = '#00ffcc';
          ctx.font = 'bold 14px monospace';
          ctx.textAlign = 'center';
          ctx.fillText("K-LABS ENGINE RUNNING", canvas.width / 2, canvas.height / 2 - 20);
          ctx.fillStyle = '#94a3b8';
          ctx.font = '11px monospace';
          ctx.fillText("GPU Pipeline Active | 60 FPS Locked", canvas.width / 2, canvas.height / 2 + 10);
          ctx.fillText("Frame Index: " + frame, canvas.width / 2, canvas.height / 2 + 35);
        }

        frame++;
        requestAnimationFrame(masterLoop);
      }
      masterLoop();

      alert("Mesin Master K-Labs Berhasil Booting! Sistem siap menerima input kontroler penuh.");
    }
  </script>
</body>
</html>
